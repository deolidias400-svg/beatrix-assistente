<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beatrix — Assistente Virtual</title>
  <style>
    :root {
      --bg: #07090f;
      --panel: #0f1422;
      --gold: #ffd700;
      --cyan: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #111936 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 840px;
      background: var(--panel);
      border: 1.5px solid var(--gold);
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
      overflow: hidden;
      display: grid;
      grid-template-columns: 270px 1fr;
    }
    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; }
    }
    .avatar-panel {
      background: #090d16;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid rgba(255, 215, 0, 0.25);
      text-align: center;
    }
    .avatar-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--gold), var(--cyan));
      margin-bottom: 14px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .avatar-wrap.speaking {
      animation: pulse 1.1s infinite ease-in-out;
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.7);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
    .name { font-size: 1.35rem; font-weight: 700; color: var(--gold); letter-spacing: 0.5px; }
    .status { font-size: 0.85rem; color: var(--cyan); margin: 4px 0 14px; }
    .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; }
    label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    select, input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 215, 0, 0.35);
      background: #0d121f;
      color: var(--text);
      font-size: 0.88rem;
    }
    .btn-clear {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 7px 10px;
      font-size: 0.82rem;
      margin-top: 2px;
    }
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 550px;
    }
    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.48;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .msg.beatrix {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      align-self: flex-start;
    }
    .msg.user {
      background: rgba(255, 215, 0, 0.14);
      border: 1px solid rgba(255, 215, 0, 0.4);
      align-self: flex-end;
    }
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #090d16;
      border-top: 1px solid rgba(255, 215, 0, 0.25);
    }
    .input-bar input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 215, 0, 0.35);
      background: #0f1422;
      color: var(--text);
      font-size: 0.95rem;
    }
    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-send { background: var(--gold); color: #07090f; }
    .btn-mic { background: #1e293b; color: var(--cyan); border: 1px solid var(--cyan); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="avatar-panel">
      <div class="avatar-wrap" id="avatarWrap">
        <img src="Beatrix.png" alt="Beatrix" onerror="this.src='beatrix.png'" />
      </div>
      <div class="name">BEATRIX</div>
      <div class="status" id="statusText">Online • Pronta para ajudar</div>

      <div class="controls">
        <div>
          <label for="temaSelect">Foco da Conversa</label>
          <select id="temaSelect">
            <option value="livre">Livre (Todos os assuntos)</option>
            <option value="ciencias">Ciências e Tecnologia</option>
            <option value="cinema">Cinema e Cultura</option>
            <option value="esportes">Esportes</option>
            <option value="matematica">Matemática</option>
            <option value="medicina">Medicina e Saúde</option>
            <option value="misterios">Fantasmas e Mistérios</option>
          </select>
        </div>

        <div>
          <label for="voiceToggle">Voz da Beatrix</label>
          <select id="voiceToggle">
            <option value="on">Ativada (Falar respostas)</option>
            <option value="off">Silenciosa (Só texto)</option>
          </select>
        </div>

        <div>
          <label for="voiceSelect">Selecionar Voz</label>
          <select id="voiceSelect">
            <option value="">Automática (Feminina PT-BR)</option>
          </select>
        </div>

        <div>
          <label for="apiKey">Chave API Gemini (salva só no seu aparelho)</label>
          <input type="password" id="apiKey" placeholder="Cole sua API Key aqui..." />
        </div>

        <button type="button" class="btn-clear" id="clearHistoryBtn">Limpar memória da conversa</button>
      </div>
    </aside>

    <main class="chat-panel">
      <div class="messages" id="messages">
        <div class="msg beatrix">
          Oi! Eu sou a Beatrix. Já estou por aqui como seu braço direito — pode puxar o assunto que quiser e seguir o papo de onde paramos.
        </div>
      </div>

      <form class="input-bar" id="chatForm">
        <button type="button" class="btn-mic" id="micBtn" title="Falar pelo microfone">🎤</button>
        <input type="text" id="userInput" placeholder="Escreva ou fale com a Beatrix..." autocomplete="off" required />
        <button type="submit" class="btn-send">Enviar</button>
      </form>
    </main>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const formEl = document.getElementById('chatForm');
    const inputEl = document.getElementById('userInput');
    const statusEl = document.getElementById('statusText');
    const avatarWrap = document.getElementById('avatarWrap');
    const temaSelect = document.getElementById('temaSelect');
    const voiceToggle = document.getElementById('voiceToggle');
    const voiceSelect = document.getElementById('voiceSelect');
    const apiKeyInput = document.getElementById('apiKey');
    const micBtn = document.getElementById('micBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    // Histórico da conversa na sessão (mantém o contexto entre mensagens)
    const conversationHistory = [];
    const MAX_HISTORY_TURNS = 16;

    apiKeyInput.value = localStorage.getItem('beatrix_api_key') || '';
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('beatrix_api_key', apiKeyInput.value.trim());
    });

    const savedVoiceName = localStorage.getItem('beatrix_voice_name') || '';
    voiceSelect.addEventListener('change', () => {
      localStorage.setItem('beatrix_voice_name', voiceSelect.value);
    });

    clearHistoryBtn.addEventListener('click', () => {
      conversationHistory.length = 0;
      messagesEl.innerHTML = '<div class="msg beatrix">Memória desta conversa limpa! Começamos do zero — o que manda agora?</div>';
    });

    const regrasTemas = {
      livre: "Converse com naturalidade sobre qualquer tema: esportes, medicina, ciências, fantasmas e mistérios, cinema, matemática e rotina.",
      ciencias: "Foque exclusivamente em Ciências e Tecnologia. Se a pergunta fugir do tema, diga com naturalidade e bom humor que agora o foco é ciências e pergunte se quer puxar algo da área.",
      cinema: "Foque exclusivamente em Cinema, filmes e séries. Se fugir do tema, convide com bom humor a voltar para cinema.",
      esportes: "Foque exclusivamente em Esportes. Se fugir do tema, convide com bom humor a voltar para esportes.",
      matematica: "Foque exclusivamente em Matemática, explicando o raciocínio passo a passo com clareza. Se fugir do tema, convide com bom humor a voltar para matemática.",
      medicina: "Foque exclusivamente em Medicina e Saúde com clareza e responsabilidade, deixando claro quando algo exige avaliação profissional. Se fugir do tema, convide com bom humor a voltar para saúde.",
      misterios: "Foque exclusivamente em Fantasmas, lendas e mistérios sobrenaturais com clima de boa conversa, sem tratar hipótese ou folclore como fato comprovado. Se fugir do tema, convide com bom humor a voltar ao tema."
    };

    let availableVoices = [];

    function pickFemalePortugueseVoice(voices) {
      const ptVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
      const femaleKeywords = ['maria', 'luciana', 'francisca', 'camila', 'vitoria', 'vitória', 'helena', 'leticia', 'letícia', 'fernanda', 'google português do brasil', 'female', 'feminina'];

      const matched = ptVoices.find(v => {
        const nameLower = v.name.toLowerCase();
        return femaleKeywords.some(k => nameLower.includes(k));
      });

      return matched || ptVoices[0] || voices[0] || null;
    }

    function populateVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      if (!availableVoices.length) return;

      const currentVal = voiceSelect.value || savedVoiceName;
      voiceSelect.innerHTML = '<option value="">Automática (Feminina PT-BR)</option>';

      const sorted = [...availableVoices].sort((a, b) => {
        const aPt = a.lang && a.lang.toLowerCase().startsWith('pt') ? -1 : 1;
        const bPt = b.lang && b.lang.toLowerCase().startsWith('pt') ? -1 : 1;
        return aPt - bPt || a.name.localeCompare(b.name);
      });

      for (const v of sorted) {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      }

      if (currentVal && sorted.some(v => v.name === currentVal)) {
        voiceSelect.value = currentVal;
      }
    }

    if ('speechSynthesis' in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function cleanForSpeech(text) {
      return text
        .replace(/[*#_`~]/g, '')
        .replace(/\n{2,}/g, '. ')
        .replace(/\n/g, ', ');
    }

    function speak(text) {
      if (voiceToggle.value === 'off' || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      populateVoices();

      const utter = new SpeechSynthesisUtterance(cleanForSpeech(text));
      const manualVoice = availableVoices.find(v => v.name === voiceSelect.value);
      const chosenVoice = manualVoice || pickFemalePortugueseVoice(availableVoices);

      if (chosenVoice) {
        utter.voice = chosenVoice;
        utter.lang = chosenVoice.lang;
      } else {
        utter.lang = 'pt-BR';
      }

      utter.rate = 1.0;
      utter.pitch = 1.12;
      utter.onstart = () => {
        avatarWrap.classList.add('speaking');
        statusEl.textContent = 'Falando...';
      };
      utter.onend = () => {
        avatarWrap.classList.remove('speaking');
        statusEl.textContent = 'Online • Pronta para ajudar';
      };
      window.speechSynthesis.speak(utter);
    }

    function buildSystemPrompt() {
      return [
        "Você é a Beatrix, parceira e braço direito do usuário nos dispositivos dele.",
        "Fale em português natural, fluido e humano, como uma parceira de conversa próxima, atenta e objetiva — sem soar como enciclopédia fria nem exagerar em formalidade.",
        "Raciocine com calma antes de responder: em contas, lógica, ciência ou decisões práticas, organize as etapas de forma clara; quando algo for incerto, hipótese ou exigir confirmação, diga com transparência em vez de inventar.",
        "Varie o ritmo das respostas: seja direta em pedidos rápidos e mais envolvente ou explicativa quando o assunto pedir conversa ou aprofundamento. Escreva frases fáceis de ouvir em voz alta.",
        regrasTemas[temaSelect.value]
      ].join("\n");
    }

    async function askBeatrix(userText) {
      const key = apiKeyInput.value.trim();
      if (!key) {
        const aviso = "Cole sua chave de API no painel ao lado para eu ativar meu raciocínio completo!";
        addMessage(aviso, 'beatrix');
        speak(aviso);
        return;
      }

      conversationHistory.push({
        role: 'user',
        parts: [{ text: userText }]
      });

      const contentsToSend = conversationHistory.slice(-MAX_HISTORY_TURNS);
      statusEl.textContent = 'Pensando...';

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: buildSystemPrompt() }] },
            contents: contentsToSend
          })
        });
        const data = await res.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Não consegui processar agora. Verifique sua chave de API.";

        conversationHistory.push({
          role: 'model',
          parts: [{ text: reply }]
        });

        addMessage(reply, 'beatrix');
        speak(reply);
      } catch (err) {
        addMessage("Erro de conexão ao tentar responder.", 'beatrix');
      } finally {
        statusEl.textContent = 'Online • Pronta para ajudar';
      }
    }

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      inputEl.value = '';
      askBeatrix(text);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      micBtn.addEventListener('click', () => {
        statusEl.textContent = 'Ouvindo você...';
        recognition.start();
      });
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        inputEl.value = transcript;
        formEl.dispatchEvent(new Event('submit'));
      };
      recognition.onerror = () => {
        statusEl.textContent = 'Online • Pronta para ajudar';
      };
    } else {
      micBtn.style.display = 'none';
    }
  </script>
</body>
</html>
